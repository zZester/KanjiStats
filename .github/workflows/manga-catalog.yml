name: Build manga catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths: ["tools/manga-list.txt"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_catalog.py --list tools/manga-list.txt --out manga-catalog.json
        env:
          JITEN_API_KEY: ${{ secrets.JITEN_API_KEY }}
      - name: Commit the catalog
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add manga-catalog.json
          if [ -d covers ]; then git add covers; fi
          git diff --cached --quiet || (git commit -m "Update manga catalog" && git push)
