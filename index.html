<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanji Garden: Top 1000</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#23201b;--mute:#8a8478;--line:#e4dfd3;--known:#2f7d5b;--known-bg:#dff1e6;--known-ink:#14412c;--unk-bg:#ece8dd;--unk-ink:#a39d8e;--accent:#c4553a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1c1f23;--ink:#ece8df;--mute:#8d9096;--line:#2c3036;--known:#5fc596;--known-bg:#1d3a2e;--known-ink:#bff0d6;--unk-bg:#23272c;--unk-ink:#5d636b;--accent:#e57a5e}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1c1f23;--ink:#ece8df;--mute:#8d9096;--line:#2c3036;--known:#5fc596;--known-bg:#1d3a2e;--known-ink:#bff0d6;--unk-bg:#23272c;--unk-ink:#5d636b;--accent:#e57a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}
main{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.ring{width:120px;height:120px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:26px}
.ring .pct small{font-size:11px;color:var(--mute);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mute)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;z-index:5}
.toolbar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer}
.toolbar button.on{background:var(--known);border-color:var(--known);color:#fff}
.toolbar .sp{flex:1}
.toolbar input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;width:140px}
.band{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px;margin-bottom:14px}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
.bh b{font-size:14px}
.bar{flex:1;height:6px;background:var(--unk-bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--known);border-radius:9px}
.bh span{color:var(--mute);min-width:72px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.t{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:var(--unk-bg);color:var(--unk-ink);border:1px solid transparent;transition:transform .12s;position:relative;padding:0;font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
.t.k{background:var(--known-bg);color:var(--known-ink);border-color:var(--known)}
.t:hover,.t:focus-visible{transform:scale(1.18);z-index:2;outline:2px solid var(--accent)}
.empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
.hide{display:none!important}
#pop{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.2);border-radius:14px;padding:12px 18px;display:none;gap:16px;align-items:center;max-width:min(520px,92vw);z-index:9}
#pop .big{font-size:48px;line-height:1}
#pop .m{font-weight:600}
#pop .d{font-size:12px;color:var(--mute);margin-top:2px}
#pop .tag{display:inline-block;font-size:11px;border-radius:99px;padding:2px 9px;margin-top:6px}
.tag.k{background:var(--known-bg);color:var(--known-ink)}.tag.u{background:var(--unk-bg);color:var(--mute)}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:center}.grid{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}.t{font-size:20px}}

.imp{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:18px;margin-bottom:20px;text-align:center}
.imp.over{border-color:var(--known);background:var(--known-bg)}
.imp p{margin:0 0 12px;font-size:14px;color:var(--mute)}
.imp .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 16px;border-radius:99px;cursor:pointer}
.btn.p{background:var(--known);border-color:var(--known);color:#fff}
.imp label.add{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
#paste{display:none;margin-top:12px}
#paste textarea{width:100%;min-height:90px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
#msg{font-size:13px;margin-top:10px;min-height:18px;color:var(--known)}
.next{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:none}
.next b{font-size:13px;display:block;margin-bottom:8px}
.next .grid{grid-template-columns:repeat(auto-fill,minmax(46px,46px))}
</style>
</head>
<body>
<main>
<h1 class="jp">漢字の庭</h1>
<p class="sub">The 1,000 most frequent kanji according to jpdb, in frequency order. Import the kanji you know and watch your garden grow.</p>
<section class="imp" id="drop">
 <p id="hint">Drop a .txt file of kanji you know here, or use the buttons. Everything stays in your browser; nothing is uploaded.</p>
 <div class="row">
  <button class="btn p" id="pick">Import text file</button>
  <button class="btn" id="pasteBtn">Paste kanji</button>
  <button class="btn" id="clear">Clear</button>
  <label class="add"><input type="checkbox" id="merge"> Add to current list</label>
 </div>
 <input type="file" id="file" accept=".txt,text/plain" hidden>
 <div id="paste"><textarea id="ta" placeholder="Paste your kanji here"></textarea><div class="row" style="margin-top:8px"><button class="btn p" id="go">Import</button></div></div>
 <div id="msg"></div>
</section>
<section class="hero">
 <div class="ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--unk-bg)" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="var(--known)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314"/></svg><div class="pct"><span id="pct"></span><small>of top 1000</small></div></div>
 <div class="stats" id="stats"></div>
</section>
<div class="next" id="next"><b>Next to learn</b><div class="grid" id="nextg"></div></div>
<div class="toolbar">
 <button class="on" data-f="all">All</button><button data-f="k">Known</button><button data-f="u">Missing</button>
 <span class="sp"></span><input id="q" placeholder="Kanji, reading or meaning">
</div>
<div id="bands"></div>
<div class="empty" id="empty">No kanji match.</div>
</main>
<div id="pop"></div>

const KEY='kanji-garden-known';
let known=new Set();
try{const s=localStorage.getItem(KEY);if(s)known=new Set(JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}}
const bands=document.getElementById('bands'),pop=document.getElementById('pop');
for(let b=0;b<10;b++){
 const s=D.slice(b*100,b*100+100);
 const el=document.createElement('div');el.className='band';
 el.innerHTML='<div class="bh"><b>'+(b*100+1)+'\u2013'+(b*100+100)+'</b><div class="bar"><i></i></div><span></span></div><div class="grid">'+s.map(x=>'<button class="t" data-r="'+x.r+'" aria-label="'+x.c+'">'+x.c+'</button>').join('')+'</div>';
 bands.appendChild(el);
}
function render(){
 const k=x=>known.has(x.c);
 const total=D.length,n=D.filter(k).length;
 const cov=m=>D.slice(0,m).filter(k).length;
 document.getElementById('pct').textContent=Math.round(n/total*100)+'%';
 document.getElementById('arc').style.strokeDashoffset=314*(1-n/total);
 const outside=known.size-n;
 document.getElementById('stats').innerHTML=[[n,'known in top 1000'],[total-n,'still to learn'],[cov(100)+'/100','top 100'],[cov(500)+'/500','top 500'],[outside,'known outside top 1000']].map(a=>'<div class="stat"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');
 document.querySelectorAll('.t').forEach(t=>t.classList.toggle('k',known.has(D[t.dataset.r-1].c)));
 document.querySelectorAll('.band').forEach((b,i)=>{
  const c=D.slice(i*100,i*100+100).filter(k).length;
  b.querySelector('.bar i').style.width=c+'%';
  b.querySelector('.bh span').textContent=c+' / 100';
 });
 const miss=D.filter(x=>!k(x)).slice(0,20);
 const nx=document.getElementById('next');
 nx.style.display=known.size&&miss.length?'block':'none';
 document.getElementById('nextg').innerHTML=miss.map(x=>'<button class="t" data-r="'+x.r+'" aria-label="'+x.c+'">'+x.c+'</button>').join('');
 apply();
}
function openCard(t){
 const x=D[t.dataset.r-1],isK=known.has(x.c);
 pop.innerHTML='<div class="big jp">'+x.c+'</div><div><div class="m">'+x.m+'</div><div class="d">On: '+(x.on.slice(0,3).join('\u3001')||'\u2013')+'</div><div class="d">Kun: '+(x.kun.slice(0,3).join('\u3001')||'\u2013')+'</div><div class="d">Rank #'+x.r+' \u00b7 '+x.g+'</div><span class="tag '+(isK?'k':'u')+'">'+(isK?'Known':'Not yet')+'</span></div>';
 pop.style.display='flex';
}
document.addEventListener('click',e=>{
 const t=e.target.closest('.t');
 if(t){openCard(t);return}
 if(!e.target.closest('#pop'))pop.style.display='none';
});
let f='all';
const kata=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
function apply(){
 const q=kata(document.getElementById('q').value.trim().toLowerCase());
 let shown=0;
 document.querySelectorAll('.band').forEach(b=>{
  let n=0;
  b.querySelectorAll('.t').forEach(t=>{
   const x=D[t.dataset.r-1],isK=known.has(x.c);
   let ok=f==='all'||(f==='k'?isK:!isK);
   if(ok&&q)ok=x.c.includes(q)||x.q.includes(q);
   t.classList.toggle('hide',!ok);
   if(ok)n++;
  });
  b.classList.toggle('hide',n===0);
  shown+=n;
 });
 document.getElementById('empty').style.display=shown?'none':'block';
}
document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(o=>o.classList.remove('on'));b.classList.add('on');f=b.dataset.f;apply()});
document.getElementById('q').oninput=apply;
const msg=document.getElementById('msg');
function importText(txt){
 const found=new Set((txt.match(/[\u3400-\u4dbf\u4e00-\u9fff]/g)||[]));
 if(!found.size){msg.textContent='No kanji found in that text.';return}
 if(!document.getElementById('merge').checked)known=new Set();
 found.forEach(c=>known.add(c));
 save();pop.style.display='none';
 msg.textContent='Imported '+found.size+' kanji. You now have '+known.size+' saved.';
 render();
}
const file=document.getElementById('file');
document.getElementById('pick').onclick=()=>file.click();
file.onchange=()=>{const fl=file.files[0];if(fl)fl.text().then(importText);file.value=''};
document.getElementById('pasteBtn').onclick=()=>{const p=document.getElementById('paste');p.style.display=p.style.display==='block'?'none':'block'};
document.getElementById('go').onclick=()=>importText(document.getElementById('ta').value);
document.getElementById('clear').onclick=()=>{known=new Set();save();msg.textContent='List cleared.';render()};
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const fl=e.dataTransfer.files[0];if(fl)fl.text().then(importText)});
render();
</script>
